<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💘</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
    }

    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 30px;
      color: #ff4d6d;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #yesBtn:hover {
      background: #e63956;
      transform: scale(1.1);
    }

    #noBtn {
      background: #ddd;
      color: #333;
    }

    #noBtn:hover {
      background: #bbb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="question">Will you be my Valentine? 💖</h1>
    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 😢</button>
  </div>

  <script>
    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    let noCount = 0;

    const messages = [
      "Will you be my Valentine? 💖",
      "Are you sure? 🥺",
      "Please think again 💔",
      "Come on… say yes 😭",
      "I won’t give up 😤",
      "YES is the only option 😍",
      "Please Say Yesssss 😭"
    ];

    noBtn.addEventListener("click", () => {
      noCount++;
      question.textContent = messages[noCount % messages.length];
    });

    yesBtn.addEventListener("click", () => {
      question.textContent = "Yayyy! 💕 I knew you'd say YES! 😘🥰";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });


  </script>

</body>
</html>
